<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enviar Correos | SoftRestaurante</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">
  <!-- Contenedor principal -->
  <div class="flex flex-col min-h-screen">
    
    <!-- Encabezado -->
    <header class="bg-white shadow px-6 py-4">
      <div class="max-w-6xl mx-auto flex justify-between items-center">
        <h1 class="text-3xl font-bold text-gray-800">
          📨 Enviar Correos Masivos a los Usuarios
        </h1>
        <a th:href="@{/usuarios}" class="bg-blue-600 text-white hover:bg-blue-700 font-semibold py-2 px-4 rounded-lg shadow">
          Volver
        </a>
      </div>
    </header>

    <!-- Formulario -->
    <main class="flex-grow px-6 py-8">
      <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow space-y-6">

        <form method="post" th:action="@{'/usuarios/enviar-masivo'}" class="space-y-6 text-lg">

          <!-- Asunto -->
          <div>
            <label for="asunto" class="block font-semibold text-gray-700 mb-1">✉️ Asunto del correo</label>
            <input type="text" id="asunto" name="asunto" 
              th:value="${asunto}" placeholder="Ej. Aviso importante" required
              class="w-full bg-gray-100 border border-gray-300 rounded px-4 py-3 text-base focus:ring-2 focus:ring-[#2a9d8f]" />

            <!-- Validación -->
            <p th:if="${asunto == null || asunto.isEmpty()}" class="text-red-600">
              El asunto no puede estar vacío.
            </p>
          </div>

          <!-- Mensaje -->
          <div>
            <label for="mensaje" class="block font-semibold text-gray-700 mb-1">📝 Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" 
              placeholder="Escribe el mensaje que recibirán todos los usuarios..." required
              class="w-full bg-gray-100 border border-gray-300 rounded px-4 py-3 text-base focus:ring-2 focus:ring-[#2a9d8f]"
              th:text="${mensaje}"></textarea>

            <!-- Validación -->
            <p th:if="${mensaje == null || mensaje.isEmpty()}" class="text-red-600">
              El mensaje no puede estar vacío.
            </p>
          </div>

          <!-- Botón Enviar -->
          <div>
            <button type="submit"
              class="w-full bg-[#2a9d8f] hover:bg-[#21867a] text-white font-semibold py-3 rounded-lg transition text-lg">
              Enviar correos
            </button>
          </div>

        </form>
      </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-white text-center py-4 text-gray-500 text-sm">
      &copy; 2025 My Cab. Todos los derechos reservados.
    </footer>

  </div>
</body>

</html>
