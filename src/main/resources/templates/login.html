<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | SoftRestaurante</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body
  class="h-screen w-screen overflow-hidden bg-gradient-to-br from-[#264653] to-[#2a9d8f] flex items-center justify-center font-sans">
  <div id="alerta" th:if="${exito}"
    class="fixed top-5 right-5 bg-green-500 text-white px-6 py-4 rounded-lg shadow-lg transition-opacity duration-500 opacity-100">
    <span th:text="${exito}"></span>
  </div>
  <div

    class="bg-white text-gray-800 rounded-3xl shadow-2xl w-[90vw] max-w-md p-8 max-h-[90vh] overflow-hidden flex flex-col justify-center">
    
    <!-- Mensaje de cierre de sesion-->
    <div th:if="${param.logout}" class="text-white text-1xl bg-red-500 mt-2 text-center p-3 rounded">
      Has cerrado sesión correctamente.
    </div>

    <!-- Error de credenciales-->
    <div th:if="${param.error}" class="text-white text-1xl bg-red-500 mt-2 text-center p-3 rounded">
      Usuario o contraseña incorrectos.
    </div>

    <!-- Acceso denegado-->
    <div th:if="${param.accesoDenegado}" class="text-white text-1xl bg-red-500 mt-2 text-center p-3 rounded">
      Acceso denegado
    </div>
    <br />
    <div class="text-center mb-6">
      <i class="bi bi-cup-hot-fill text-4xl text-[#2a9d8f]"></i>
      <h1 class="text-2xl font-bold text-[#264653] mt-2">SoftRestaurante</h1>
    </div>

    <div class="text-center text-sm text-gray-600 mb-6">
      Accede a tu plataforma de gestión de ventas, pedidos e inventario.
    </div>

    <!-- 🔑 Ajustado -->
    <form method="post" th:action="@{/login}" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-semibold text-[#264653]">
          <i class="bi bi-person-fill mr-1"></i> Usuario
        </label>
        <input type="text" id="nombreUsuario" name="nombreUsuario" required placeholder="Usuario"
          class="w-full mt-1 bg-gray-100 border-2 border-gray-300 rounded-xl px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#2a9d8f]" />
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-[#264653]">
          <i class="bi bi-lock-fill mr-1"></i> Contraseña
        </label>
        <input type="password" id="pswUsuario" name="pswUsuario" required placeholder="********"
          class="w-full mt-1 bg-gray-100 border-2 border-gray-300 rounded-xl px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#2a9d8f]" />
      </div>

      <button type="submit"
        class="w-full bg-[#2a9d8f] hover:bg-[#21867a] text-white font-bold py-2 rounded-xl text-lg flex items-center justify-center gap-2">
        <i class="bi bi-door-open-fill"></i> Ingresar
      </button>
    </form>

    <div class="text-center text-sm text-gray-600 mt-6">
      ¿Olvidaste tu contraseña?
      <a href="#" class="text-[#2a9d8f] font-semibold hover:underline">Recupérala</a>
    </div>

    <div class="text-center text-sm text-gray-600 mt-6">
      ¿No tienes cuenta?
      <a th:href="@{/registro}" class="text-[#2a9d8f] font-semibold hover:underline">Regístrate</a>
      <br>
    </div>
  </div>
</body>

</html>

<script>
  // Desaparece después de 4 segundos
  setTimeout(() => {
    const alerta = document.getElementById('alerta');
    if (alerta) {
      alerta.classList.add('opacity-0'); // transición
    }
  }, 4000);
</script>
